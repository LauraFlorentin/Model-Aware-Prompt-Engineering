name: Package ChatGPT Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin.json"
      - "skills/**"
      - ".github/workflows/package-chatgpt-plugin.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin archive
        run: |
          mkdir -p dist/model-aware-prompt-engineering/skills
          cp plugin.json dist/model-aware-prompt-engineering/plugin.json
          cp -R skills/prompt-engineering dist/model-aware-prompt-engineering/skills/prompt-engineering
          cd dist
          zip -r model-aware-prompt-engineering-chatgpt.zip model-aware-prompt-engineering

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: model-aware-prompt-engineering-chatgpt
          path: dist/model-aware-prompt-engineering-chatgpt.zip
